 # Path to the root directory of the dataset.
 # The path should be relative to the 'ObjectDetection' root folder. 
 path: ./datasets/my_first_dataset # This was pointing to coco8, now corrected.
 
 # Directories for training and validation images.
 # These paths are relative to the 'path' defined above.
 train: images/train
 val: images/val
 
 # Class names. The order must match the class index used during labeling.
 # For example, if 'car' was the first class you created in LabelImg, it's index 0.
 names:
   0: class_name_1  # TODO: Replace with your first class name
   1: class_name_2  # TODO: Replace with your second class name
   # Add more classes as needed